name: Bug report
description: Report a Mala sound, control, preset, or installation issue
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Hector firmware and Mala version
      placeholder: "Hector firmware 407, Mala 0.1.0-beta.6"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sound or CV
        - Touchscreen or MIDI
        - Preset or frozen buffer
        - USB install or rollback
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected behavior, actual behavior, and a minimal patch description.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Relevant report or observations
      description: Redact personal data. Do not upload device backups, keys, serials, firmware images, or private recordings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I reviewed attachments for private device and preset data.
          required: true
