name: Source and installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install computer-only Qt5 test runtime
        run: python -m pip install PySide2==5.15.2.1
      - name: Build portable DSP
        run: python3 tools/build.py
      - name: Test DSP and disposable installer fixtures
        run: python3 -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORMTHEME: ''
      - name: Exercise the actual v2 interface and fresh defaults
        run: python3 -B tools/qt_check.py --fresh --v2 --output build/ci-qt
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORMTHEME: ''
      - name: Audit public export and corresponding source
        run: python3 tools/audit.py
